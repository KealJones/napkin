name: Pages

# Napkin Studio as a static site: the runtime runs in the visitor's browser (a Worker over
# OPFS), from the packs and an empty store. No model reads or teaches there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The DailyDialog corpus the Reply Concept reads; gitignored, so fetched here.
      - run: sh src/seed/dialogue/fetch.sh
        working-directory: packages/concept-runtime
      - run: pnpm --filter @napkin/concept-runtime --filter @napkin/studio-server build
      - run: pnpm --filter @napkin/studio-client build:pages
        env:
          NAPKIN_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio-client/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
